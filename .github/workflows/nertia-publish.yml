# .github/workflows/nertia-publish.yml
# No secrets: when a run passes, the Nertia GitHub app publishes the nertia-site artifact.
name: Publish to nertia
on:
  push: { branches: [main] }
  workflow_dispatch: { inputs: { ref: { description: 'ref to build', required: false } } }
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ inputs.ref || github.ref }}' }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build && test -f out/index.html
      - uses: actions/upload-artifact@v4
        with: { name: nertia-site, path: out, retention-days: 3, if-no-files-found: error }
